<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Page Not Found — CurioPress</title>

<meta
name="robots"
content="noindex, follow"
>

<link
rel="stylesheet"
href="/css/main.css"
>

<link
rel="stylesheet"
href="/css/themes/professional.css"
>

</head>

<body>

<header class="site-header">

<div class="container nav-wrap">

<a
class="brand"
href="/"
>
<span class="brand-mark">C</span>
<span class="brand-name">CurioPress</span>
</a>

</div>

</header>


<main>

<section class="hero container">

<div class="hero-copy">

<span class="eyebrow">
404 • Not Found
</span>

<h1>
That page wandered off.
</h1>

<p>
The page you requested could not be found.
It may have moved or may not exist yet.
</p>

<div class="hero-actions">

<a
class="button button-primary"
href="/"
>
Back to Home
</a>

<a
class="button button-secondary"
href="/#categories"
>
Browse Categories
</a>

</div>

</div>


<div class="hero-card">

<span class="hero-card-label">
CurioPress
</span>

<h2>
Let's get you somewhere useful.
</h2>

<p>
Use the navigation or return to the homepage.
</p>

</div>

</section>

</main>


<script src="/js/main.js"></script>

</body>
</html>
